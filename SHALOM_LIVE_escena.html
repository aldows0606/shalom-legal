<body>
<div id="escena">
  <div id="fondo"></div>
  <canvas id="chispas" width="1080" height="1920"></canvas>
  <div id="meta"><div class="cab"><span class="txt" id="mTxt"></span><span id="mNum"></span></div>
    <div class="barra"><div class="lleno" id="mLleno"></div><div class="pct" id="mPct"></div></div></div>
  <div id="titulo"></div>
  <div id="ranking"></div>
  <div id="alerta"><div class="img"></div><div><div class="t1" id="aNom"></div><div class="t2" id="aTxt"></div></div></div>
  <div id="estado"></div>
</div>
<script>
/* Ajusta la escena al tamaño de la ventana (en LIVE Studio/OBS a 1080x1920 queda en 100%) */
function ajusta(){const e=document.getElementById('escena'),s=Math.min(innerWidth/1080,innerHeight/1920);
  e.style.transform=`translate(${(innerWidth-1080*s)/2}px,${(innerHeight-1920*s)/2}px) scale(${s})`}
addEventListener('resize',ajusta);ajusta();
/* ===== Configuración por URL =====
   ?titulo=HISTORIA DE JOSÉ      título
   &meta=30000                   meta de monedas (0 = ocultar barra)
   &inicio=0                     monedas con que arranca la barra
   &metatxt=AYÚDAME A SEGUIR CRECIENDO
   &gracias=GRACIAS, DIOS TE LO MULTIPLIQUE
   &demo=1                       simula regalos para probar
   &ws=ws://localhost:21213/     TikFinity
*/
const P=new URLSearchParams(location.search);
const CFG={
  titulo:P.get('titulo')||'PROVERBIOS',
  meta:+(P.get('meta')??30000), inicio:+(P.get('inicio')||0),
  metatxt:P.get('metatxt')||'AYÚDAME A SEGUIR CRECIENDO',
  gracias:P.get('gracias')||'GRACIAS, DIOS TE LO MULTIPLIQUE',
  demo:P.get('demo')==='1', ws:P.get('ws')||'ws://localhost:21213/'
};
document.getElementById('titulo').textContent=CFG.titulo;
const AV_DEF='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#8a6a4a"/><circle cx="50" cy="38" r="18" fill="#f3e6d0"/><path d="M18 92c4-20 18-30 32-30s28 10 32 30z" fill="#f3e6d0"/></svg>');

/* ===== Meta ===== */
let total=CFG.inicio;
function pintaMeta(){
  const m=document.getElementById('meta'); if(!CFG.meta){m.style.display='none';return}
  const p=Math.min(100,Math.floor(total*100/CFG.meta));
  document.getElementById('mTxt').textContent=CFG.metatxt;
  cuenta(total);
  document.getElementById('mLleno').style.width=Math.max(p,1)+'%';
  const pe=document.getElementById('mPct'); if(pe.textContent!==p+'%'){pe.textContent=p+'%';pe.classList.remove('sube');void pe.offsetWidth;pe.classList.add('sube')}
}
let mostrado=CFG.inicio,tCuenta;
function cuenta(obj){clearInterval(tCuenta);tCuenta=setInterval(()=>{
  if(mostrado>=obj){mostrado=obj;clearInterval(tCuenta)}else mostrado+=Math.max(1,Math.ceil((obj-mostrado)/8));
  document.getElementById('mNum').textContent=`${mostrado}/${CFG.meta}`},60)}
pintaMeta();

/* ===== Chispas ===== */
const cv=document.getElementById('chispas'),cx=cv.getContext('2d');
const nueva=()=>({x:600+Math.random()*480,y:500+Math.random()*1300,r:1+Math.random()*3,v:.3+Math.random(),a:Math.random(),d:.005+Math.random()*.015});
const ch=Array.from({length:60},nueva);
(function dib(){cx.clearRect(0,0,1080,1920);
  for(const c of ch){c.y-=c.v;c.x+=Math.sin(c.y/60)*.4;c.a+=c.d;if(c.a>1||c.a<0)c.d*=-1;if(c.y<560)Object.assign(c,nueva(),{y:1750});
    cx.beginPath();cx.arc(c.x,c.y,c.r,0,7);cx.fillStyle=`rgba(255,215,130,${Math.max(0,c.a)})`;cx.shadowColor='rgba(255,200,90,.9)';cx.shadowBlur=10;cx.fill()}
  requestAnimationFrame(dib)})();

/* ===== Ranking ===== */
const tabla=new Map();
const MED=['🥇','🥈','🥉'];
function pintaRanking(subio){
  const top=[...tabla.values()].sort((a,b)=>b.monedas-a.monedas).slice(0,7);
  const el=document.getElementById('ranking');el.innerHTML='';
  top.forEach((u,i)=>{
    const f=document.createElement('div');f.className='fila'+(u.id===subio?' sube':'');
    f.innerHTML=`<div class="pos ${i<3?'med':''}">${i<3?MED[i]:(i+1)+'.'}</div>
      <div class="cav">${i===0?'<div class="crown">👑</div>':''}<img class="av" src="${u.foto||AV_DEF}"></div>
      <div class="datos"><div class="nom"></div><div class="mon"><b>♥</b>${u.monedas.toLocaleString('es')}</div></div>`;
    f.querySelector('.nom').textContent=u.nombre;
    f.querySelector('.av').onerror=function(){this.src=AV_DEF};
    el.appendChild(f);
  });
}

/* ===== Tarjeta de regalo (cola) ===== */
const cola=[];let ocupado=false;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function tarjeta(u,cant){cola.push({u,cant});if(!ocupado)sig()}
function sig(){const it=cola.shift();if(!it){ocupado=false;return}ocupado=true;
  const a=document.getElementById('alerta');
  document.getElementById('aNom').textContent=it.u.nombre;
  document.getElementById('aTxt').innerHTML=`${esc(CFG.gracias)} <b>${it.cant}</b><span style="text-transform:none">Moneda(s)</span>`;
  a.classList.add('ver');setTimeout(()=>{a.classList.remove('ver');setTimeout(sig,400)},3800)}

/* ===== Agradecimiento flotante ===== */
const colaF=[];let flotando=false;
function flotar(u,txt){if(colaF.length<6)colaF.push({u,txt});if(!flotando)sigF()}
function sigF(){const it=colaF.shift();if(!it){flotando=false;return}flotando=true;
  const d=document.createElement('div');d.className='flota';
  d.style.left=(560+Math.random()*40)+'px';d.style.top=(760+Math.random()*40)+'px';
  d.innerHTML=`<img src="${it.u.foto||AV_DEF}"><div class="n"></div><div class="g"></div>`;
  d.querySelector('img').onerror=function(){this.src=AV_DEF};
  d.querySelector('.n').textContent=it.u.nombre;d.querySelector('.g').textContent=it.txt;
  document.getElementById('escena').appendChild(d);setTimeout(()=>d.remove(),3000);setTimeout(sigF,3100)}

/* ===== Corazones, pulgares y compartidos ===== */
const SHARE='<svg viewBox="0 0 64 64" width="64" height="64"><circle cx="32" cy="32" r="30" fill="#FFC21A"/><path d="M36 18l14 13-14 13v-8c-10 0-16 3-21 10 2-11 8-19 21-20z" fill="#fff"/></svg>';
function particula(html,x,y,size,dur){
  const h=document.createElement('div');h.className='corazon';h.innerHTML=html;
  h.style.left=x+'px';h.style.top=y+'px';h.style.fontSize=size+'px';h.style.animationDuration=dur+'s';
  h.style.setProperty('--dx',(Math.random()*50-35)+'px');h.style.setProperty('--rot',(Math.random()*50-25)+'deg');
  document.getElementById('escena').appendChild(h);setTimeout(()=>h.remove(),dur*1000+100)}
function corazones(n){for(let k=0;k<n;k++)setTimeout(()=>
  particula('❤️',900+Math.random()*30,1560+Math.random()*80,46+Math.random()*26,3),k*140)}
function pulgares(n){for(let k=0;k<n;k++)setTimeout(()=>
  particula('👍',880+Math.random()*60,1580+Math.random()*60,26+Math.random()*10,2.6),k*90)}
function compartido(){particula(SHARE,895+Math.random()*25,1560,64,3.4)}
/* Ambiente: oleadas de corazones rojos (decoración) */
const OLAS=[20,12,15];let ola=0;
function oleada(){const n=OLAS[ola%OLAS.length];ola++;
  for(let k=0;k<n;k++)setTimeout(()=>corazones(1),k*(2200/n)+Math.random()*120);
  setTimeout(oleada,(+P.get('olas')||6)*1000)}
setTimeout(oleada,1500);

/* ===== Eventos TikFinity / TikTok-Live-Connector ===== */
function usuario(d){const u=d.user||d;
  return{id:u.uniqueId||u.userId||'anon',nombre:u.nickname||u.uniqueId||'Amigo',
    foto:u.profilePictureUrl||(u.profilePicture&&u.profilePicture.urls&&u.profilePicture.urls[0])||''}}
const likes=new Map();
function evento(tipo,d){
  tipo=(tipo||'').toLowerCase();
  if(tipo==='gift'){
    if(d.giftType===1&&d.repeatEnd===false)return;
    const u=usuario(d),cant=d.repeatCount||1,mon=(d.diamondCount||1)*cant;
    const p=tabla.get(u.id)||{...u,monedas:0};p.monedas+=mon;p.nombre=u.nombre;p.foto=u.foto||p.foto;tabla.set(u.id,p);
    total+=mon;pintaMeta();pintaRanking(u.id);tarjeta(u,mon);
    flotar(u,`¡Gracias por ${cant}x ${d.giftName||'regalo'}!`);
  }else if(tipo==='like'){
    const u=usuario(d);const n=(likes.get(u.id)||0)+(d.likeCount||1);likes.set(u.id,n);
    corazones(Math.min(6,d.likeCount||1)); pulgares(Math.min(10,(d.likeCount||1)*2));
    if(Math.random()<.15) flotar(u,`¡Gracias por ${n} me gusta!`);
  }else if(tipo==='follow'||(tipo==='social'&&/follow/i.test(d.displayType||''))){
    flotar(usuario(d),'¡Gracias por seguirnos!');
  }else if(tipo==='share'||(tipo==='social'&&/share/i.test(d.displayType||''))){
    compartido(); flotar(usuario(d),'¡Gracias por compartir! 🙏');
  }else if(tipo==='member'){
    if(Math.random()<.5) flotar(usuario(d),'¡Bienvenido(a)! Dios te bendiga 🙏');
  }else if(tipo==='chat'){
    const txt=(d.comment||'').toLowerCase();
    if(/am[eé]n|bendi|ora|gloria|dios/.test(txt)) flotar(usuario(d),'¡Amén! Gracias por estar aquí 🙏');
  }
}
function conectar(){let ws;try{ws=new WebSocket(CFG.ws)}catch(e){return setTimeout(conectar,5000)}
  ws.onopen=()=>document.getElementById('estado').textContent='';
  ws.onmessage=m=>{try{const j=JSON.parse(m.data);evento(j.event||j.type,j.data||j)}catch(e){}};
  ws.onclose=()=>{setTimeout(conectar,5000)};
  ws.onerror=()=>ws.close()}
conectar();
